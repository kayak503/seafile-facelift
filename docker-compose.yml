services:
  seafile-facelift:
    # Override with a version tag or digest through SEAFILE_FACELIFT_IMAGE.
    image: ${SEAFILE_FACELIFT_IMAGE:-ghcr.io/kayak503/seafile-facelift:latest}
    container_name: seafile-facelift
    restart: unless-stopped
    environment:
      # These values are deployment-owned and cannot be changed in the browser.
      SEAFILE_URL: ${SEAFILE_URL:?Set SEAFILE_URL in .env}
      PUBLIC_SEAFILE_URL: ${PUBLIC_SEAFILE_URL:?Set PUBLIC_SEAFILE_URL in .env}
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_NAME: ${APP_NAME:-Seafile-Facelift}
      APP_ACCENT: ${APP_ACCENT:-#2563EB}
      ADMIN_URL: ${ADMIN_URL:-}
    ports:
      # Keep this ordinary host mapping so Caddy can reach it from the existing deployment topology.
      - '${SEAFILE_FACELIFT_PORT:-8082}:3000'
